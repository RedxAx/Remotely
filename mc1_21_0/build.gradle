plugins {
    id 'java-library'
    id 'fabric-loom'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21"
    mappings "net.fabricmc:yarn:1.21+build.9:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21"

    implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    implementation "com.jcraft:jsch:0.1.55"
    implementation "com.vladsch.flexmark:flexmark:0.62.2"
    implementation "org.jsoup:jsoup:1.15.3"

    compileOnly 'com.cinemamod:mcef:2.1.6-1.21'
    runtimeOnly 'com.cinemamod:mcef-fabric:2.1.6-1.21'

    implementation project(':common')
    shadow project(':common')
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

shadowJar {
    configurations = [project.configurations.shadow]
    exclude("META-INF")
}

remapJar {
    dependsOn(shadowJar)
    mustRunAfter(shadowJar)
    inputFile = shadowJar.archiveFile.get().asFile
}

build.dependsOn shadowJar