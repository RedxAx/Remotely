plugins {
    id "fabric-loom"
    id "maven-publish"
    id "com.gradleup.shadow"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.5-rc2"
    mappings "net.fabricmc:yarn:1.21.5-rc2+build.1"

    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.5"

    implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    implementation "com.jcraft:jsch:0.1.55"
    implementation "com.vladsch.flexmark:flexmark:0.62.2"
    implementation "org.jsoup:jsoup:1.15.3"

    compileOnly 'com.cinemamod:mcef:2.1.6-1.21.4'
    runtimeOnly 'com.cinemamod:mcef-fabric:2.1.6-1.21.4'

    implementation project(':common')
    shadow project(':common')
}


shadowJar {
    configurations = [project.configurations.shadow]
    exclude("META-INF")
}

remapJar {
    dependsOn(shadowJar)
    mustRunAfter(shadowJar)
    inputFile = shadowJar.archiveFile.get().asFile
}

build.dependsOn shadowJar

