plugins {
    id 'java-library'
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    mappings "net.fabricmc:yarn:1.20.4+build.3"
    modImplementation "net.fabricmc:fabric-loader:0.16.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.2+1.20.4"

    implementation "com.mojang:brigadier:1.0.18"

    implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    implementation "com.jcraft:jsch:0.1.55"
    implementation "com.vladsch.flexmark:flexmark:0.62.2"
    implementation "org.jsoup:jsoup:1.15.3"

    shadow "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    shadow "com.jcraft:jsch:0.1.55"
    shadow "com.vladsch.flexmark:flexmark:0.62.2"
    shadow "org.jsoup:jsoup:1.15.3"

    compileOnly 'com.cinemamod:mcef:2.1.6-1.20.4'
    runtimeOnly 'com.cinemamod:mcef-fabric:2.1.6-1.20.4'
}

shadowJar {
    configurations = [project.configurations.shadow]
    exclude("META-INF")
}

remapJar {
    dependsOn(shadowJar)
    mustRunAfter(shadowJar)
    inputFile = shadowJar.archiveFile.get().asFile
}

build.dependsOn shadowJar

