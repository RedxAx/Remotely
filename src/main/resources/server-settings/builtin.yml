providerId: remotely
priority: 0
packs:
  - id: purpur
    name: Purpur
    description: Purpur-specific server configuration.
    priority: 4
    software: [purpur]
    documents:
      - path: purpur.yml
        format: yaml
        fields:
          - id: alternate-keepalive
            key: settings.use-alternate-keepalive
            type: boolean
            tab: Software Settings
            group: Purpur
            name: Alternate Keepalive
            description: Uses Purpur's alternate keepalive handling for unstable player connections.
            default: false
          - id: tps-catchup
            key: settings.tps-catchup
            type: boolean
            tab: Software Settings
            group: Purpur
            name: TPS Catchup
            description: Allows the server to briefly run faster after falling behind its normal tick rate.
            default: true
