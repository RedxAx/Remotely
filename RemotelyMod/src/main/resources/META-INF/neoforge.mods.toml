authors="RedxAx"
description="${mod_description}"
logoFile="assets/Remotely.png"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minor_mc_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="textile"
mandatory=true
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="omnicore"
mandatory=true
versionRange="*"
ordering="NONE"
side="BOTH"