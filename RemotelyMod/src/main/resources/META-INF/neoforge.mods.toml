modLoader="javafml"
loaderVersion="[1,)"
issueTrackerURL="https://github.com/RedxAx/Remotely/issues"
license="Custom License"

[[mixins]]
config = "mixins.${mod_id}.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
